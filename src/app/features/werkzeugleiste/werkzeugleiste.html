<!--
  Zeile 2 der Kopfzone (#80): Nachricht + Pfad links, Werkzeuge rechts.
  Feste Zonen — die Leiste bricht nie um, sie schrumpft nach Prioritaet.
-->
<div id="werkzeugleiste" class="kopfleiste">
  <!-- Zone: wo bin ich — Nachrichtenwahl und Pfad als eine Kette -->
  <div class="zone zoneOrt">
    <app-message-picker></app-message-picker>
    <app-crumbs></app-crumbs>
  </div>

  <span class="zoneTrenner"></span>

  <!-- Zone: wie arbeite ich -->
  <div class="zone zoneModus">
    <div class="modusSeg" role="group" aria-label="Arbeitsweise" [title]="modusTitel()">
      <button
        [class.aktiv]="modus() === 'betrachten'"
        [attr.aria-pressed]="modus() === 'betrachten'"
        [disabled]="!hasRoot()"
        title="Nur ansehen — es wird nichts entschieden und nichts geändert"
        (click)="setzeModus('betrachten')"
      >
        Betrachten
      </button>
      <button
        [class.aktiv]="modus() === 'bearbeiten'"
        [attr.aria-pressed]="modus() === 'bearbeiten'"
        [disabled]="modusGesperrt()"
        title="Frei entscheiden — Status, Kardinalitäten und Werte am ausgewählten Element"
        (click)="setzeModus('bearbeiten')"
      >
        Bearbeiten
      </button>
      <button
        [class.aktiv]="modus() === 'gefuehrt'"
        [attr.aria-pressed]="modus() === 'gefuehrt'"
        [disabled]="modusGesperrt()"
        [title]="
          isCreate() || isMessage()
            ? 'Geführt durch die Nachricht: Station für Station blättern, Werte eintragen, Auswahlen treffen'
            : 'Geführt durch alle offenen Entscheidungen der Profilierung'
        "
        (click)="setzeModus('gefuehrt')"
      >
        Geführt
      </button>
    </div>

    <app-search></app-search>

    @if (ueberlagerung.aktiv()) {
      <app-ueberlagerung-menu></app-ueberlagerung-menu>
    }

    <app-menu label="Ansicht" kurz="≡" btnClass="mAnsicht" #ansicht>
      <label class="menuItem" title="Versionsunterschiede im Baum markieren">
        <input
          type="checkbox"
          [disabled]="!hasIdxB()"
          [checked]="state.showDiff()"
          (change)="state.showDiff.set(checked($event))"
        />
        Diff
      </label>
      <label
        class="menuItem"
        title="Aktiver Pfad und seine Kinder in voller Größe, alles andere als Kompakt-Chips"
      >
        <input
          type="checkbox"
          [checked]="state.focusMode()"
          (change)="state.focusMode.set(checked($event))"
        />
        Fokus
      </label>
      <label class="menuItem">
        <input
          type="checkbox"
          [checked]="state.showTech()"
          (change)="state.showTech.set(checked($event))"
        />
        Technik
      </label>
      <label class="menuItem">
        <input
          type="checkbox"
          [checked]="state.showRefs()"
          (change)="state.showRefs.set(checked($event))"
        />
        Verweise
      </label>
      <label
        class="menuItem"
        title="Blätter auf eine bündige Wertespalte ausrichten (aus: Blatt direkt am Elternknoten, kurze Wege)"
      >
        <input
          type="checkbox"
          [checked]="state.alignLeaves()"
          (change)="state.alignLeaves.set(checked($event))"
        />
        Blätter ausrichten
      </label>
      @if (!isSchemaView()) {
        <label
          class="menuItem"
          [title]="
            state.hatVorgabe()
              ? 'Von der gebundenen Profilierung Ausgeschlossenes einblenden (gesperrt, mit Begründung)'
              : 'Ausgeschlossene Elemente ausblenden'
          "
        >
          <input
            type="checkbox"
            [checked]="state.onlyProfile()"
            (change)="state.onlyProfile.set(checked($event))"
          />
          nur Profil
        </label>
        <label
          class="menuItem"
          title="Nur Elemente mit Wert/Inhalt zeigen statt des gesamten Standards"
        >
          <input
            type="checkbox"
            [checked]="state.onlyValues()"
            (change)="toggleOnlyValues(checked($event))"
          />
          nur Werte
        </label>
      }
      <div class="menuSep"></div>
      <button class="menuItem" [disabled]="!hasRoot()" (click)="ansicht.close(); expand()">
        Alles ausklappen
      </button>
      <button class="menuItem" [disabled]="!hasRoot()" (click)="ansicht.close(); collapse()">
        Zuklappen
      </button>
    </app-menu>
  </div>

  <!-- Zone: Fortschritt — reservierte Breite, damit der wechselnde Text nichts verschiebt -->
  <div class="zone zoneFortschritt" [title]="fortschrittText()">
    @if (fortschrittAnteil() !== null) {
      <span class="fsBalken" aria-hidden="true">
        <span class="fsBalkenFuell" [style.width.%]="fortschrittAnteil()! * 100"></span>
      </span>
    }
    <span id="fortschritt">{{ fortschrittText() }}</span>
  </div>
</div>
