<dialog #dlg id="grundlageDlg">
  <input #xsdInput type="file" webkitdirectory multiple class="hidden" (change)="onXsd($event)" />
  <input
    #clInput
    type="file"
    multiple
    accept=".xml,.zip"
    class="hidden"
    (change)="onCodelist($event)"
  />

  <h3 style="margin-top: 0">Grundlage</h3>
  <p style="font-size: 12.5px; color: var(--muted); margin-top: 0">{{ verInfo() }}</p>

  @if (bundledVersions().length) {
    <div class="grundlageListe">
      @for (v of bundledVersions(); track v.dir) {
        <button
          class="menuItem grundlageZeile"
          [class.aktiv]="v.dir === activeBundle()"
          [title]="quellHinweis(v)"
          (click)="bundledPick.emit(v.dir)"
        >
          <span class="grundlageHaken" aria-hidden="true">{{
            v.dir === activeBundle() ? '✓' : ''
          }}</span>
          <span class="menuText">XJustiz {{ v.label }}{{ v.default ? ' (Standard)' : '' }}</span>
          @if (v.zipUrl) {
            <span class="menuQuelle">xjustiz.de</span>
          }
        </button>
      }
    </div>
  }

  <div class="grundlageAktionen">
    <button
      title="Eigenen Ordner mit XJustiz-Schemadateien laden"
      (click)="close(); pick(xsdInput)"
    >
      Eigener XSD-Ordner…
    </button>
    <button
      title="Versionsliste von xjustiz.de neu abrufen und bereits geholte Versionen auf den veröffentlichten Stand bringen. Geholte Versionen bleiben gespeichert und veralten nicht von selbst."
      (click)="close(); remoteSchemaClick.emit()"
    >
      Von xjustiz.de aktualisieren
    </button>
    <button
      [disabled]="!hasIdx()"
      title="Alle vom Standard genutzten Codelisten über die XRepository-REST-Schnittstelle abrufen"
      (click)="close(); xrepClick.emit()"
    >
      Codelisten: XRepository
    </button>
    <button title="Genericode-Dateien oder ZIP aus Dateien laden" (click)="close(); pick(clInput)">
      Codelisten: Datei…
    </button>
    <button
      [disabled]="!hasIdx()"
      title="Zweiten XSD-Ordner (andere XJustiz-Version) laden und Unterschiede anzeigen"
      (click)="close(); diffClick.emit()"
    >
      {{ diffLabel() }}
    </button>
    <button
      title="Protokoll der letzten Fehler und Warnungen als Textdatei speichern (für Fehlermeldungen)"
      (click)="close(); logExportClick.emit()"
    >
      Fehlerprotokoll speichern…
    </button>
  </div>

  <div style="text-align: right; margin-top: 14px">
    <button class="primary" (click)="close()">Schließen</button>
  </div>
</dialog>
