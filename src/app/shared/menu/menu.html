<button
  [disabled]="disabled()"
  [title]="titel()"
  [class]="btnClass()"
  [attr.aria-expanded]="open()"
  aria-haspopup="true"
  (click)="toggle(btn); $event.stopPropagation()"
  (keydown.escape)="schliesseMitEscape($event)"
  #btn
>
  <span class="lbl-lang">{{ label() }}</span>
  @if (kurz()) {
    <span class="lbl-kurz">{{ kurz() }}</span>
  }
  @if (pfeil()) {
    {{ richtung() === 'oben' ? '▴' : '▾' }}
  }
</button>

@if (open()) {
  <!-- Der Schliess-Backdrop liegt im DOM **innerhalb** der klickbaren Kachel
       bzw. Listenzeile, in der das Menue steht. Ohne stopPropagation traefe
       "daneben klicken" den Wirt darunter und oeffnete den Eintrag. -->
  <div
    class="menuBackdrop"
    style="position: fixed; inset: 0; z-index: 39"
    aria-hidden="true"
    (click)="close(); $event.stopPropagation()"
  ></div>
  <div
    class="menuPanel"
    #panel
    [style.left.px]="pos().left"
    [style.top.px]="richtung() === 'unten' ? pos().top : null"
    [style.bottom.px]="richtung() === 'oben' ? pos().bottom : null"
    [style.max-width.px]="pos().breite"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.escape)="schliesseMitEscape($event); btn.focus()"
  >
    <ng-content></ng-content>
  </div>
}
