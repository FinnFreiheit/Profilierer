<button
  [disabled]="disabled()"
  [title]="titel()"
  [class]="btnClass()"
  (click)="toggle(btn); $event.stopPropagation()"
  #btn
>
  <span class="lbl-lang">{{ label() }}</span>
  @if (kurz()) {
    <span class="lbl-kurz">{{ kurz() }}</span>
  }
  @if (pfeil()) {
    ▾
  }
</button>

@if (open()) {
  <div style="position: fixed; inset: 0; z-index: 39" (click)="close()"></div>
  <div
    class="menuPanel"
    [style.left.px]="pos().left"
    [style.top.px]="pos().top"
    (click)="$event.stopPropagation()"
  >
    <ng-content></ng-content>
  </div>
}
