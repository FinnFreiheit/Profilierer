<div class="metaGrid">
  @if (geerbtVon(); as profil) {
    <!-- <span> statt <label>: es gibt hier kein Formularelement, auf das ein
         Label zeigen könnte — die Nachricht folgt ihrer Profilierung, und der
         Satz sagt, wo die Zuordnung stattdessen zu ändern ist. -->
    <span class="ablageLabel">Projekt</span>
    <div class="ablageGeerbt">
      folgt der Profilierung <b>{{ profil }}</b> — dort einsortieren
    </div>
  } @else {
    <label for="ablageProjekt">Projekt</label>
    <select
      id="ablageProjekt"
      [value]="projektId()"
      (change)="projektId.set($any($event.target).value)"
    >
      <option value="">(keinem Projekt zugeordnet)</option>
      @for (p of projekte(); track p.id) {
        <option [value]="p.id">{{ p.name }}</option>
      }
      <option [value]="neu">neues Projekt anlegen…</option>
    </select>

    @if (legtNeuesAn()) {
      <label for="ablageNeu">Name</label>
      <input
        type="text"
        id="ablageNeu"
        placeholder="z. B. GenUVA"
        [value]="neuerName()"
        (input)="neuerName.set($any($event.target).value)"
      />
    }
  }

  <label for="ablageTags">Schlagworte</label>
  <app-tag-eingabe
    feldId="ablageTags"
    [(text)]="tags"
    [vorschlaege]="tagVorschlaege()"
  ></app-tag-eingabe>
</div>
