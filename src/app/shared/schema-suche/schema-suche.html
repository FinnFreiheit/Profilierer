<div class="dashSuche">
  <input
    class="suchfeld"
    type="search"
    [placeholder]="
      hasIdx() ? 'Im XJustiz-Standard suchen: Nachricht oder Datentyp…' : 'Schema wird geladen…'
    "
    [disabled]="!hasIdx()"
    [value]="query()"
    (input)="onInput($event)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
    (keydown)="onKeydown($event)"
  />
  @if (open()) {
    <div class="srPanel open">
      <app-schema-treffer
        [nachrichten]="nachrichten()"
        [typen]="typen()"
        [aktiv]="aktiv()"
        (nachricht)="oeffne('nachricht', $event)"
        (typ)="oeffne('typ', $event)"
      ></app-schema-treffer>
      @if (!alle().length) {
        <div style="padding: 12px 14px; color: var(--muted); font-size: 12.5px">keine Treffer</div>
      }
    </div>
  }
</div>
