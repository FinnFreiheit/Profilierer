<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XJustiz Pfadfinder">
  <!-- Baumkasten im Kleinformat: Wurzelkasten links, zwei Kindkaesten rechts,
       verbunden durch die gleichen waagerechten Bezierkurven wie im TreeCanvas.
       Bewusst nur zwei Kinder — bei 16 px verschmelzen drei Kaesten zu Brei. -->
  <rect width="32" height="32" rx="7" fill="#14213d"/>
  <g fill="none" stroke="#93a0bd" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 16 C 16 16, 16 7.5, 19.5 7.5"/>
    <path d="M12 16 C 16 16, 16 24.5, 19.5 24.5"/>
  </g>
  <rect x="3" y="12" width="9" height="8" rx="2.2" fill="#fca311"/>
  <rect x="19.5" y="3.5" width="9.5" height="8" rx="2.2" fill="#ffffff"/>
  <rect x="19.5" y="20.5" width="9.5" height="8" rx="2.2" fill="#ffffff"/>
</svg>
